[package]
name = "listenin"
version = "0.1.0"
description = "Local-first, open-source music player"
authors = ["beratboomindev"]
edition = "2021"
license = "MIT"
repository = "https://github.com/beratboomindev/listenin"

[lib]
name = "listenin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
